# Render Blueprint（https://render.com）。リポジトリ接続で自動読込。
#
# 構成: Node Web Service（Starter・スリープなし） ＋ Render Postgres。
#   - Starter を使うのは、無料プランが15分アイドルでスリープし、研修開始時に
#     最初の参加者が数十秒待たされるため。
#   - Render のファイルシステムは Starter でも揮発性のため、SQLite では
#     デプロイのたびにデータが消える。本番では必ず DATABASE_URL（Postgres）を設定する。
#
# データベースはダッシュボードから作成し、その **Internal Database URL** を
# DATABASE_URL に設定する（手順は DEPLOY.md「方法A」を参照）。
# Blueprint 側で databases: を定義すると既存DBとは別に新規作成されてしまうため、
# ここでは意図的に定義していない。
services:
  - type: web
    name: mg-system
    runtime: node
    plan: starter # ← 無料プランに戻さないこと（スリープで研修開始時に待たされる）
    rootDir: app
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # 自動デプロイはしない。研修中に意図せず本番が入れ替わるのを避けるため、
    # main へマージしたあと、ダッシュボードの Manual Deploy で任意のタイミングに反映する。
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      # ---- 必須 ----
      - key: DATABASE_URL
        sync: false # ← Render Postgres の Internal Database URL をダッシュボードで設定
      - key: MG_ADMIN_PW
        sync: false # ← 講師ログインの強力なパスワードをダッシュボードで設定
      # ---- 任意 ----
      # MG_PG_CA … Postgres の TLS 検証に独自CAが必要な場合のみ設定する
